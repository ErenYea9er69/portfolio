<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Minecraft Diamond Sword Pixel Art with Tip precisely at (0, 0) -->
  <g transform="scale(2)">
    <!-- Blade Tip at (0, 0) -->
    <rect x="0" y="0" width="1" height="1" fill="#0e4a47"/>
    <rect x="1" y="0" width="1" height="1" fill="#0e4a47"/>
    <rect x="0" y="1" width="1" height="1" fill="#0e4a47"/>

    <!-- Blade Upper Shading -->
    <rect x="1" y="1" width="1" height="1" fill="#7fffff"/>
    <rect x="2" y="1" width="1" height="1" fill="#4deeea"/>
    <rect x="1" y="2" width="1" height="1" fill="#4deeea"/>
    <rect x="2" y="2" width="1" height="1" fill="#2bc5be"/>

    <!-- Blade Spine & Edge (Diagonal downwards from 0,0 to 8,8) -->
    <rect x="3" y="1" width="1" height="1" fill="#0e4a47"/>
    <rect x="1" y="3" width="1" height="1" fill="#0e4a47"/>
    <rect x="3" y="2" width="1" height="1" fill="#4deeea"/>
    <rect x="2" y="3" width="1" height="1" fill="#4deeea"/>
    <rect x="3" y="3" width="1" height="1" fill="#2bc5be"/>

    <rect x="4" y="2" width="1" height="1" fill="#0e4a47"/>
    <rect x="2" y="4" width="1" height="1" fill="#0e4a47"/>
    <rect x="4" y="3" width="1" height="1" fill="#4deeea"/>
    <rect x="3" y="4" width="1" height="1" fill="#4deeea"/>
    <rect x="4" y="4" width="1" height="1" fill="#2bc5be"/>

    <rect x="5" y="3" width="1" height="1" fill="#0e4a47"/>
    <rect x="3" y="5" width="1" height="1" fill="#0e4a47"/>
    <rect x="5" y="4" width="1" height="1" fill="#4deeea"/>
    <rect x="4" y="5" width="1" height="1" fill="#4deeea"/>
    <rect x="5" y="5" width="1" height="1" fill="#2bc5be"/>

    <rect x="6" y="4" width="1" height="1" fill="#0e4a47"/>
    <rect x="4" y="6" width="1" height="1" fill="#0e4a47"/>
    <rect x="6" y="5" width="1" height="1" fill="#4deeea"/>
    <rect x="5" y="6" width="1" height="1" fill="#4deeea"/>
    <rect x="6" y="6" width="1" height="1" fill="#2bc5be"/>

    <rect x="7" y="5" width="1" height="1" fill="#0e4a47"/>
    <rect x="5" y="7" width="1" height="1" fill="#0e4a47"/>
    <rect x="7" y="6" width="1" height="1" fill="#4deeea"/>
    <rect x="6" y="7" width="1" height="1" fill="#4deeea"/>
    <rect x="7" y="7" width="1" height="1" fill="#2bc5be"/>

    <!-- Guard -->
    <rect x="8" y="5" width="1" height="1" fill="#2e1f14"/>
    <rect x="8" y="6" width="1" height="1" fill="#583c26"/>
    <rect x="9" y="6" width="1" height="1" fill="#2e1f14"/>
    <rect x="5" y="8" width="1" height="1" fill="#2e1f14"/>
    <rect x="6" y="8" width="1" height="1" fill="#583c26"/>
    <rect x="6" y="9" width="1" height="1" fill="#2e1f14"/>
    <rect x="7" y="8" width="1" height="1" fill="#583c26"/>
    <rect x="8" y="7" width="1" height="1" fill="#583c26"/>
    <rect x="8" y="8" width="1" height="1" fill="#2e1f14"/>

    <!-- Handle / Grip (Oak Wood) -->
    <rect x="9" y="9" width="1" height="1" fill="#855b32"/>
    <rect x="10" y="9" width="1" height="1" fill="#5c3d1f"/>
    <rect x="9" y="10" width="1" height="1" fill="#5c3d1f"/>
    <rect x="10" y="10" width="1" height="1" fill="#855b32"/>
    <rect x="11" y="10" width="1" height="1" fill="#5c3d1f"/>
    <rect x="10" y="11" width="1" height="1" fill="#5c3d1f"/>
    <rect x="11" y="11" width="1" height="1" fill="#855b32"/>

    <!-- Pommel -->
    <rect x="12" y="11" width="1" height="1" fill="#2bc5be"/>
    <rect x="11" y="12" width="1" height="1" fill="#2bc5be"/>
    <rect x="12" y="12" width="1" height="1" fill="#0e4a47"/>
    <rect x="13" y="12" width="1" height="1" fill="#0e4a47"/>
    <rect x="12" y="13" width="1" height="1" fill="#0e4a47"/>
    <rect x="13" y="13" width="1" height="1" fill="#0e4a47"/>
  </g>
</svg>
