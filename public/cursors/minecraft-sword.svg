<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Minecraft Diamond Sword Pixel Art (Classic 16x16 scaled to 32x32) -->
  <g transform="scale(2)">
    <!-- Blade Tip & Edge Outline -->
    <rect x="13" y="1" width="1" height="1" fill="#0e4a47"/>
    <rect x="14" y="2" width="1" height="1" fill="#0e4a47"/>
    <rect x="12" y="1" width="1" height="1" fill="#0e4a47"/>
    <rect x="11" y="2" width="1" height="1" fill="#0e4a47"/>
    <rect x="10" y="3" width="1" height="1" fill="#0e4a47"/>
    <rect x="9" y="4" width="1" height="1" fill="#0e4a47"/>
    <rect x="8" y="5" width="1" height="1" fill="#0e4a47"/>
    <rect x="7" y="6" width="1" height="1" fill="#0e4a47"/>
    <rect x="6" y="7" width="1" height="1" fill="#0e4a47"/>

    <!-- Blade Diamond Body -->
    <rect x="13" y="2" width="1" height="1" fill="#4deeea"/>
    <rect x="12" y="2" width="1" height="1" fill="#7fffff"/>
    <rect x="12" y="3" width="1" height="1" fill="#2bc5be"/>
    <rect x="11" y="3" width="1" height="1" fill="#4deeea"/>
    <rect x="11" y="4" width="1" height="1" fill="#2bc5be"/>
    <rect x="10" y="4" width="1" height="1" fill="#4deeea"/>
    <rect x="10" y="5" width="1" height="1" fill="#2bc5be"/>
    <rect x="9" y="5" width="1" height="1" fill="#4deeea"/>
    <rect x="9" y="6" width="1" height="1" fill="#2bc5be"/>
    <rect x="8" y="6" width="1" height="1" fill="#4deeea"/>
    <rect x="8" y="7" width="1" height="1" fill="#2bc5be"/>
    <rect x="7" y="7" width="1" height="1" fill="#4deeea"/>
    <rect x="7" y="8" width="1" height="1" fill="#2bc5be"/>

    <!-- Guard & Quillons -->
    <rect x="8" y="8" width="1" height="1" fill="#2e1f14"/>
    <rect x="9" y="8" width="1" height="1" fill="#583c26"/>
    <rect x="10" y="7" width="1" height="1" fill="#583c26"/>
    <rect x="10" y="8" width="1" height="1" fill="#2e1f14"/>
    <rect x="6" y="8" width="1" height="1" fill="#2e1f14"/>
    <rect x="6" y="9" width="1" height="1" fill="#583c26"/>
    <rect x="5" y="9" width="1" height="1" fill="#2e1f14"/>
    <rect x="5" y="10" width="1" height="1" fill="#583c26"/>

    <!-- Grip / Hilt -->
    <rect x="5" y="10" width="1" height="1" fill="#855b32"/>
    <rect x="4" y="11" width="1" height="1" fill="#855b32"/>
    <rect x="3" y="12" width="1" height="1" fill="#855b32"/>
    <rect x="4" y="12" width="1" height="1" fill="#5c3d1f"/>
    <rect x="3" y="13" width="1" height="1" fill="#5c3d1f"/>

    <!-- Pommel -->
    <rect x="2" y="13" width="1" height="1" fill="#2bc5be"/>
    <rect x="1" y="14" width="1" height="1" fill="#2bc5be"/>
    <rect x="2" y="14" width="1" height="1" fill="#0e4a47"/>
    <rect x="1" y="15" width="1" height="1" fill="#0e4a47"/>
    <rect x="2" y="15" width="1" height="1" fill="#0e4a47"/>
  </g>
</svg>

