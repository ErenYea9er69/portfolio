<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <!-- Japanese Katana Samurai Sword Cursor (Hotspot at tip: 2, 2) -->
  <defs>
    <filter id="bladeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#c93a2b" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bladeGrad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <g filter="url(#bladeGlow)">
    <!-- Blade Spine & Hamon -->
    <path d="M2 2 C 5 6, 12 14, 20 20 L 21 21 L 19 22 C 12 16, 5 9, 2 2 Z" fill="url(#bladeGrad)" stroke="#475569" stroke-width="0.5"/>
    <!-- Blade Cutting Edge (Razor Sharp) -->
    <path d="M2 2 C 6 8, 13 16, 20 20" stroke="url(#edgeGrad)" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Habaki (Brass blade collar) -->
    <rect x="19.5" y="19.5" width="2.5" height="2.5" transform="rotate(-45 20.75 20.75)" fill="#d4af37" stroke="#947829" stroke-width="0.5"/>

    <!-- Tsuba (Sword Guard - Round Dark Iron with gold rim) -->
    <ellipse cx="22" cy="22" rx="4.5" ry="2" transform="rotate(45 22 22)" fill="#1c1917" stroke="#d4af37" stroke-width="1"/>
    <circle cx="22" cy="22" r="1.2" fill="#c93a2b"/>

    <!-- Tsuka (Hilt - Cord Wrapped) -->
    <path d="M23 23 L 31 31" stroke="#1c1917" stroke-width="3.2" stroke-linecap="round"/>
    <!-- Hilt Red & White Tsuka-ito diamond wrap -->
    <path d="M24 24 L 25 25" stroke="#c93a2b" stroke-width="2.5"/>
    <path d="M26.5 26.5 L 27.5 27.5" stroke="#f1f5f9" stroke-width="2.5"/>
    <path d="M29 29 L 30 30" stroke="#c93a2b" stroke-width="2.5"/>

    <!-- Kashira (Gold Pommel Cap) -->
    <circle cx="31.5" cy="31.5" r="1.6" fill="#d4af37" stroke="#947829" stroke-width="0.6"/>
  </g>
</svg>

