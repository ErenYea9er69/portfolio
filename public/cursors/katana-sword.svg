<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <!-- Japanese Katana Samurai Sword Cursor (Hotspot at tip: 0, 0) -->
  <defs>
    <filter id="bladeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#c93a2b" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <g filter="url(#bladeGlow)">
    <!-- Blade Spine & Hamon (Tip at 0, 0) -->
    <path d="M0 0 C 3 4, 10 12, 18 18 L 19 19 L 17 20 C 10 14, 3 7, 0 0 Z" fill="url(#bladeGrad)" stroke="#475569" stroke-width="0.5"/>
    <!-- Blade Cutting Edge (Razor Sharp) -->
    <path d="M0 0 C 4 6, 11 14, 18 18" stroke="url(#edgeGrad)" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Habaki (Brass blade collar) -->
    <rect x="17.5" y="17.5" width="2.5" height="2.5" transform="rotate(-45 18.75 18.75)" fill="#d4af37" stroke="#947829" stroke-width="0.5"/>

    <!-- Tsuba (Sword Guard - Round Dark Iron with gold rim) -->
    <ellipse cx="20" cy="20" rx="4.5" ry="2" transform="rotate(45 20 20)" fill="#1c1917" stroke="#d4af37" stroke-width="1"/>
    <circle cx="20" cy="20" r="1.2" fill="#c93a2b"/>

    <!-- Tsuka (Hilt - Cord Wrapped) -->
    <path d="M21 21 L 29 29" stroke="#1c1917" stroke-width="3.2" stroke-linecap="round"/>
    <!-- Hilt Red & White Tsuka-ito diamond wrap -->
    <path d="M22 22 L 23 23" stroke="#c93a2b" stroke-width="2.5"/>
    <path d="M24.5 24.5 L 25.5 25.5" stroke="#f1f5f9" stroke-width="2.5"/>
    <path d="M27 27 L 28 28" stroke="#c93a2b" stroke-width="2.5"/>

    <!-- Kashira (Gold Pommel Cap) -->
    <circle cx="29.5" cy="29.5" r="1.6" fill="#d4af37" stroke="#947829" stroke-width="0.6"/>
  </g>
</svg>
