<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Minecraft Diamond Pickaxe with Tip at (0, 0) -->
  <g transform="scale(2)">
    <!-- Pickaxe Head Tip at (0, 0) -->
    <rect x="0" y="0" width="1" height="1" fill="#0e4a47"/>
    <rect x="1" y="0" width="1" height="1" fill="#0e4a47"/>
    <rect x="2" y="0" width="1" height="1" fill="#0e4a47"/>
    <rect x="0" y="1" width="1" height="1" fill="#0e4a47"/>
    <rect x="1" y="1" width="1" height="1" fill="#4deeea"/>
    <rect x="2" y="1" width="1" height="1" fill="#4deeea"/>
    <rect x="3" y="1" width="1" height="1" fill="#4deeea"/>
    <rect x="0" y="2" width="1" height="1" fill="#0e4a47"/>
    <rect x="1" y="2" width="1" height="1" fill="#4deeea"/>
    <rect x="2" y="2" width="1" height="1" fill="#2bc5be"/>
    <rect x="3" y="2" width="1" height="1" fill="#2bc5be"/>
    <rect x="4" y="2" width="1" height="1" fill="#0e4a47"/>

    <!-- Arch curve of pickaxe head -->
    <rect x="4" y="1" width="4" height="1" fill="#0e4a47"/>
    <rect x="4" y="2" width="4" height="1" fill="#4deeea"/>
    <rect x="5" y="3" width="3" height="1" fill="#2bc5be"/>
    <rect x="8" y="2" width="2" height="2" fill="#0e4a47"/>
    <rect x="8" y="3" width="1" height="1" fill="#2bc5be"/>
    <rect x="9" y="4" width="1" height="1" fill="#0e4a47"/>

    <!-- Handle (Diagonal downward) -->
    <rect x="5" y="4" width="1" height="1" fill="#855b32"/>
    <rect x="6" y="5" width="1" height="1" fill="#5c3d1f"/>
    <rect x="7" y="6" width="1" height="1" fill="#855b32"/>
    <rect x="8" y="7" width="1" height="1" fill="#5c3d1f"/>
    <rect x="9" y="8" width="1" height="1" fill="#855b32"/>
    <rect x="10" y="9" width="1" height="1" fill="#5c3d1f"/>
    <rect x="11" y="10" width="1" height="1" fill="#855b32"/>
    <rect x="12" y="11" width="1" height="1" fill="#5c3d1f"/>
  </g>
</svg>
